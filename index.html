```html
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das ist nicht meine Freundin!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(circle at top left, #3b1d5a, transparent 40%),
                radial-gradient(circle at bottom right, #0f4c5c, transparent 40%),
                #0b0b12;

            color: white;
        }

        .card {
            padding: 60px 80px;
            text-align: center;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 30px;

            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.45);

            animation: erscheinen 1s ease-out;
        }

        h1 {
            margin: 0;

            font-size: clamp(48px, 7vw, 90px);
            line-height: 1.05;
            font-weight: 800;
            letter-spacing: -2px;

            background: linear-gradient(
                135deg,
                #ffffff,
                #c7d2fe,
                #a5f3fc
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes erscheinen {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 600px) {
            .card {
                width: 90%;
                padding: 40px 20px;
                border-radius: 24px;
            }

            h1 {
                letter-spacing: -1px;
            }
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>
            Das<br>
            ist<br>
            nicht<br>
            meine<br>
            Freundin!
        </h1>
    </div>

</body>
</html>
```
