<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das ist nicht meine Freundin!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;
            background: #05000a;
        }

        /* Pinkes Neon-Licht */
        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: #ff00cc;
            filter: blur(150px);
            opacity: 0.3;

            top: -200px;
            left: -200px;

            animation: bewegen1 7s infinite alternate ease-in-out;
        }

        /* Blaues Neon-Licht */
        body::after {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;

            background: #00eaff;
            filter: blur(150px);
            opacity: 0.25;

            bottom: -200px;
            right: -200px;

            animation: bewegen2 8s infinite alternate ease-in-out;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 20px;
            text-align: center;
        }

        /* Englischer Haupttext */
        .neon {
            margin: 0;

            font-size: clamp(55px, 12vw, 150px);

            line-height: 0.95;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 2px;

            color: white;

            text-shadow:
                0 0 5px white,
                0 0 10px #ff00cc,
                0 0 20px #ff00cc,
                0 0 40px #ff00cc,
                0 0 80px #ff00cc;

            animation: flackern 3s infinite;
        }

        .neon span {
            display: block;
        }

        /* Spanischer Text */
        .spanisch {
            margin-top: 35px;

            font-size: clamp(25px, 5vw, 55px);
            font-weight: 700;
            letter-spacing: 3px;

            color: white;

            text-shadow:
                0 0 5px white,
                0 0 10px #00eaff,
                0 0 20px #00eaff,
                0 0 40px #00eaff;

            animation: spanischGlow 2.5s infinite alternate ease-in-out;
        }

        @keyframes flackern {
            0%, 18%, 22%, 63%, 100% {
                opacity: 1;
            }

            20%, 21%, 62% {
                opacity: 0.65;
            }
        }

        @keyframes spanischGlow {
            from {
                opacity: 0.75;
                transform: scale(1);
            }

            to {
                opacity: 1;
                transform: scale(1.02);
            }
        }

        @keyframes bewegen1 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(300px, 250px);
            }
        }

        @keyframes bewegen2 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-300px, -250px);
            }
        }

        /* Optimierung für kleine Handy-Bildschirme */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }

            .neon {
                font-size: clamp(50px, 17vw, 90px);
                letter-spacing: 1px;
            }

            .spanisch {
                margin-top: 25px;
                font-size: clamp(22px, 6vw, 40px);
                letter-spacing: 1px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- Englischer Text -->
        <h1 class="neon">
            <span>she</span>
            <span>is</span>
            <span>not</span>
            <span>my</span>
            <span>girlfriend!</span>
        </h1>

        <!-- Spanischer Text -->
        <div class="spanisch">
            ¡Ella no es mi novia!
        </div>

    </div>

</body>
</html>
