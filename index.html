<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>She Is Not My Girlfriend</title>

    <style>
        /* =========================================
           GRUNDLAGEN
           ========================================= */

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;

            font-family: Arial, Helvetica, sans-serif;

            background:
                radial-gradient(
                    circle at 15% 20%,
                    rgba(255, 0, 204, 0.12),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 80%,
                    rgba(0, 234, 255, 0.10),
                    transparent 35%
                ),
                #05000a;
        }


        /* =========================================
           NEON-LICHTER IM HINTERGRUND
           ========================================= */

        body::before {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            left: -200px;
            top: -200px;

            border-radius: 50%;

            background: #ff00cc;

            filter: blur(150px);

            opacity: 0.30;

            animation:
                pinkLight 7s ease-in-out infinite alternate;

            pointer-events: none;
        }


        body::after {
            content: "";

            position: fixed;

            width: 450px;
            height: 450px;

            right: -200px;
            bottom: -200px;

            border-radius: 50%;

            background: #00eaff;

            filter: blur(150px);

            opacity: 0.25;

            animation:
                blueLight 8s ease-in-out infinite alternate;

            pointer-events: none;
        }


        /* =========================================
           HAUPT-CONTAINER
           ========================================= */

        .container {
            position: relative;

            z-index: 2;

            width: 100%;
            max-width: 1600px;

            min-height: 100vh;

            padding: 30px 20px;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            text-align: center;
        }


        /* =========================================
           ENGLISCHER TEXT
           ========================================= */

        .neon {
            width: 100%;
            max-width: 1500px;

            margin: 0;
            padding: 0;

            font-size: clamp(55px, 11vw, 150px);

            line-height: 0.93;

            font-weight: 900;

            text-transform: uppercase;

            letter-spacing: 2px;

            color: white;

            text-align: center;

            text-shadow:
                0 0 5px white,
                0 0 10px #ff00cc,
                0 0 20px #ff00cc,
                0 0 40px #ff00cc,
                0 0 80px #ff00cc;

            animation: flicker 3s infinite;
        }


        .neon span {
            display: block;

            width: 100%;

            text-align: center;
        }


        /* Das lange Wort etwas kleiner */
        .girlfriend {
            font-size: 0.78em;
        }


        /* =========================================
           SPANISCHER TEXT
           ========================================= */

        .spanisch {
            width: 100%;

            margin-top: 38px;

            padding: 0 10px;

            font-size: clamp(24px, 4.5vw, 55px);

            line-height: 1.1;

            font-weight: 700;

            letter-spacing: 2px;

            color: white;

            text-align: center;

            text-shadow:
                0 0 5px white,
                0 0 10px #00eaff,
                0 0 20px #00eaff,
                0 0 40px #00eaff;

            animation: spanishGlow 2.5s ease-in-out infinite alternate;
        }


        /* =========================================
           ANIMATIONEN
           ========================================= */

        @keyframes flicker {

            0%,
            18%,
            22%,
            63%,
            100% {
                opacity: 1;
            }

            20%,
            21%,
            62% {
                opacity: 0.65;
            }
        }


        @keyframes spanishGlow {

            from {
                opacity: 0.75;

                text-shadow:
                    0 0 5px white,
                    0 0 10px #00eaff,
                    0 0 20px #00eaff,
                    0 0 30px #00eaff;
            }

            to {
                opacity: 1;

                text-shadow:
                    0 0 5px white,
                    0 0 15px #00eaff,
                    0 0 30px #00eaff,
                    0 0 50px #00eaff;
            }
        }


        @keyframes pinkLight {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(300px, 250px);
            }
        }


        @keyframes blueLight {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-300px, -250px);
            }
        }


        /* =========================================
           HANDY
           ========================================= */

        @media (max-width: 600px) {

            .container {
                width: 100%;

                min-height: 100vh;

                padding: 20px 8px;
            }


            .neon {
                width: 100%;

                font-size: clamp(38px, 15vw, 80px);

                line-height: 0.95;

                letter-spacing: 0;

                margin: 0;

                text-align: center;
            }


            .neon span {
                width: 100%;

                text-align: center;
            }


            .girlfriend {
                /*
                 * Wichtig:
                 * Das lange Wort wird auf dem Handy
                 * deutlich kleiner dargestellt.
                 */
                font-size: 0.65em;

                white-space: nowrap;
            }


            .spanisch {
                width: 100%;

                margin-top: 28px;

                padding: 0 5px;

                font-size: clamp(19px, 6vw, 40px);

                line-height: 1.1;

                letter-spacing: 1px;

                text-align: center;
            }
        }


        /* =========================================
           SEHR KLEINE HANDYS
           ========================================= */

        @media (max-width: 380px) {

            .container {
                padding: 15px 5px;
            }


            .neon {
                font-size: clamp(34px, 14vw, 65px);

                line-height: 0.95;
            }


            .girlfriend {
                font-size: 0.60em;
            }


            .spanisch {
                margin-top: 24px;

                font-size: 18px;

                letter-spacing: 0;
            }
        }


        /* =========================================
           HANDY QUERFORMAT
           ========================================= */

        @media (max-height: 500px) and (orientation: landscape) {

            .container {
                padding: 10px;
            }


            .neon {
                font-size: clamp(30px, 10vh, 70px);
            }


            .girlfriend {
                font-size: 0.70em;
            }


            .spanisch {
                margin-top: 15px;

                font-size: clamp(16px, 4vh, 30px);
            }
        }
    </style>
</head>


<body>

    <main class="container">

        <!-- =====================================
             HAUPTTEXT
             ===================================== -->

        <h1 class="neon">

            <span>She</span>

            <span>Is</span>

            <span>Not</span>

            <span>My</span>

            <span class="girlfriend">
                Girlfriend!
            </span>

        </h1>


        <!-- =====================================
             SPANISCHER TEXT
             ===================================== -->

        <div class="spanisch">
            ¡Ella no es mi novia!
        </div>

    </main>

</body>
</html>
