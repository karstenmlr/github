<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100923">
  <meta name="description" content="Life is too short for someday. A little food for thought in vivid colors.">
  <title>A little food for thought</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23100923'/%3E%3Cpath d='M24 4 10 23h10l-4 13 15-20H21z' fill='%23e5ff62'/%3E%3C/svg%3E">
  <style>
    /* Eigenständige Neon-Seite: alle Stile lokal, ohne externe Abhängigkeiten. */
    :root { color-scheme: dark; --ink:#100923; --paper:#fff7ff; --pink:#ff57d3; --lime:#e5ff62; --cyan:#65f5ed; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--ink); color:var(--paper); font-family:"Segoe UI",Arial,sans-serif; }
    body::before { content:""; position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 85% 20%,#6221a44d,transparent 55%),radial-gradient(ellipse at 10% 80%,#ff298125,transparent 45%); }
    .page { position:relative; max-width:1600px; min-height:100svh; margin:auto; padding:32px clamp(24px,6vw,100px); display:flex; flex-direction:column; }
    /* Die verbliebene Kopfzeile bleibt rechtsbündig. */
    header { display:flex; justify-content:flex-end; align-items:center; gap:20px; }
    .edition { font-size:12px; text-transform:uppercase; letter-spacing:3px; color:#cbbbdc; }
    main { flex:1; display:grid; align-content:center; padding:70px 0 85px; }
    .eyebrow { margin:0 0 28px; color:var(--cyan); letter-spacing:4px; font-size:13px; font-weight:700; text-transform:uppercase; }
    h1 { position:relative; z-index:1; margin:0; max-width:1100px; font-size:clamp(48px,8.8vw,132px); font-weight:900; letter-spacing:-.065em; line-height:1.02; }
    h1 .line { display:block; }
    .short { color:var(--pink); text-shadow:0 0 48px #ff3ec747; }
    .later { display:inline-block; position:relative; color:var(--lime); }
    .later::after { content:""; position:absolute; left:-2%; right:-2%; top:55%; height:clamp(5px,.7vw,10px); background:var(--pink); transform:rotate(-6deg); box-shadow:0 0 25px #ff57d36b; }
    .bottom { display:flex; align-items:center; gap:28px; margin-top:50px; }
    .sticker { display:inline-block; padding:16px 25px; background:var(--lime); color:var(--ink); border:2px solid var(--ink); outline:1px solid var(--lime); font-weight:900; font-size:24px; letter-spacing:-1px; transform:rotate(-6deg); box-shadow:7px 7px 0 var(--pink); }
    .note { max-width:300px; font-size:17px; color:#d5c7e3; line-height:1.65; }
    /* Die spanische Version bleibt kleiner als der englische Haupttext. */
    .translations { position:relative; z-index:1; display:grid; grid-template-columns:1fr; gap:32px; max-width:650px; margin-top:56px; }
    .translation { border-left:2px solid var(--cyan); padding-left:20px; }
    .translation[lang="es"] { border-color:var(--pink); }
    .translation .language { margin:0 0 12px; font-size:12px; letter-spacing:2px; color:#cbbbdc; text-transform:uppercase; }
    .translation h2 { margin:0 0 16px; font-size:clamp(24px,3vw,40px); line-height:1.15; letter-spacing:-.035em; }
    .translation h2 em { font-style:normal; color:var(--lime); }
    .translation p { margin:8px 0 0; font-size:16px; line-height:1.55; color:#d5c7e3; }
    .translation strong { color:var(--cyan); }
    .translation[lang="es"] strong { color:var(--pink); }
    @media(max-width:650px) { .translations { grid-template-columns:1fr; margin-top:40px; } }
    /* Der dekorative Ring bleibt unabhängig vom Text und fängt keine Eingaben ab. */
    .ring { position:absolute; right:6%; top:27%; width:clamp(100px,19vw,285px); aspect-ratio:1; border:2px solid var(--cyan); border-radius:50%; opacity:.55; transform:rotate(-28deg) scaleX(.55); box-shadow:0 0 30px #65f5ed24,inset 0 0 30px #65f5ed24; pointer-events:none; }
    .ring::after { content:""; position:absolute; inset:17px -20px; border:2px solid var(--pink); border-radius:50%; transform:rotate(55deg); }
    footer { border-top:1px solid #ffffff24; padding-top:22px; color:#bcaecb; font-size:13px; }
    .colors { display:flex; gap:7px; }
    .colors i { display:block; width:25px; height:7px; background:var(--pink); }
    .colors i:nth-child(2) { background:var(--cyan); }
    .colors i:nth-child(3) { background:var(--lime); }
    @media(max-width:650px) { .page { padding:24px; } .edition { font-size:12px; letter-spacing:1px; } main { padding:75px 0 60px; } h1 { font-size:clamp(40px,10.2vw,66px); letter-spacing:-.06em; } .ring { top:18%; right:4%; opacity:.25; } .bottom { flex-direction:column; align-items:flex-start; gap:20px; margin-top:35px; } .note { margin-bottom:0; } footer { align-items:flex-end; } }
    @media(prefers-reduced-motion:no-preference) { main { animation:arrive .8s ease-out both; } @keyframes arrive { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } } }
  </style>
</head>
<body>
  <div class="page">
    <header><div class="edition">Less later. More now.</div></header>
    <main>
      <div class="ring" aria-hidden="true"></div>
      <p class="eyebrow">A little food for thought</p>
      <h1><span class="line">Life is</span><span class="line"><span class="short">too short</span> for</span><span class="later">someday.</span></h1>
      <div class="bottom"><span class="sticker">DO IT NOW.</span><p class="note">Be brave. Start small.<br>But start.</p></div>
      <div class="translations">
        <section class="translation" lang="es" aria-label="Español">
          <p class="language">Español · Una pequeña reflexión</p>
          <h2>La vida es demasiado corta para <em>«algún día».</em></h2>
          <p><strong>HAZLO AHORA.</strong> Atrévete. Empieza poco a poco. Pero empieza.</p>
          <p>Menos después. Más ahora.</p>
        </section>
      </div>
    </main>
  </div>
</body>
</html>
