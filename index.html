<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das ist nicht meine Freundin!</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;

            background: #05000a;
            overflow: hidden;
        }

        /* Neon-Hintergrund */
        body::before {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;

            background: #ff00cc;
            filter: blur(180px);
            opacity: 0.25;

            top: -250px;
            left: -200px;

            animation: bewegen 6s infinite alternate ease-in-out;
        }

        body::after {
            content: "";
            position: fixed;
            width: 600px;
            height: 600px;

            background: #00eaff;
            filter: blur(180px);
            opacity: 0.2;

            bottom: -250px;
            right: -200px;

            animation: bewegen2 7s infinite alternate ease-in-out;
        }

        .container {
            position: relative;
            z-index: 2;

            text-align: center;
            padding: 50px;
        }

        .neon {
            margin: 0;

            font-size: clamp(70px, 11vw, 150px);
            line-height: 0.95;

            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 4px;

            color: white;

            text-shadow:
                0 0 5px white,
                0 0 10px #ff00cc,
                0 0 20px #ff00cc,
                0 0 40px #ff00cc,
                0 0 80px #ff00cc;

            animation: neonFlackern 3s infinite;
        }

        .neon span {
            display: block;
        }

        @keyframes neonFlackern {
            0%, 18%, 22%, 63%, 100% {
                opacity: 1;
            }

            20%, 21%, 62% {
                opacity: 0.65;
            }
        }

        @keyframes bewegen {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(300px, 200px);
            }
        }

        @keyframes bewegen2 {
            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-250px, -150px);
            }
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            .neon {
                font-size: 60px;
                letter-spacing: 2px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h1 class="neon">
            <span>Das</span>
            <span>ist</span>
            <span>nicht</span>
            <span>meine</span>
            <span>Freundin!</span>
        </h1>
    </div>

</body>
</html>
